<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>

body{

margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:linear-gradient(#ff8fb8,#ffdbe9);

font-family:sans-serif;

overflow:hidden;

text-align:center;

}


h1{

font-size:45px;
color:white;

}


p{

width:85%;

font-size:22px;

color:white;

line-height:40px;

}


.heart{

position:absolute;

font-size:30px;

animation:fall linear infinite;

}


@keyframes fall{

0%{

transform:translateY(-100px);

opacity:1;

}


100%{

transform:translateY(110vh);

opacity:0;

}

}


</style>

</head>


<body>


<h1>
❤️ รักเธอนะ ❤️
</h1>


<p>

ขอบคุณที่เข้ามาเป็นส่วนหนึ่งของชีวิตเรา

<br>

ถึงบางวันจะมีงอนกัน

หรือทะเลาะกันบ้าง

<br>

แต่เราก็ยังเลือกเธอเหมือนเดิม

<br><br>

วันนี้ ❤️

พรุ่งนี้ ❤️

และทุกวันหลังจากนี้

</p>



<script>

setInterval(()=>{


const heart=document.createElement("div");


heart.className="heart";


heart.innerHTML="❤️";


heart.style.left=Math.random()*100+"vw";


heart.style.animationDuration=

(Math.random()*3+2)+"s";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},5000);



},180);


</script>


</body>

</html>
